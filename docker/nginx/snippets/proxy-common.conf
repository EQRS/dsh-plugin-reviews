# 反代公共头：安全基线 + 真实 IP 透传。
#
# ⚠️ 为什么单独一个片段文件：nginx 的 `add_header` 是**替换**语义 ——
# 子块里写了一个 add_header，父块继承下来的全部作废。所以"要设 Cache-Control"的
# location 如果不显式 include 这份片段，安全头会**悄悄消失**（这是 nginx 的经典坑）。
# 需要设缓存头的 location 都 include 本文件。

# ---------- 安全基线 ----------
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# ---------- 真实 IP 透传 ----------
# X-Real-IP：nginx 用**对端地址**覆盖，值是权威的，客户端的输入不可能影响它。
proxy_set_header X-Real-IP $remote_addr;
# X-Forwarded-For：本项目**刻意用 $remote_addr 覆盖而不是 $proxy_add_x_forwarded_for 追加**。
#   追加语义会把客户端自己伪造的 XFF 保留在最左侧；应用若取最左值当客户端地址，
#   就等于"谁都能改自己的 IP 记录"。本部署里 nginx 是唯一入口，覆盖后 XFF 只有一个值，
#   与 X-Real-IP 一致且不可伪造。
#   ⚠️ 将来若在前面再加 CDN/负载均衡，必须改成 `set_real_ip_from <CDN网段>` +
#      `real_ip_header X-Forwarded-For` + `$proxy_add_x_forwarded_for` 追加，
#      并让应用信任"最右侧的非代理地址"——**不要**在原样覆盖的情况下把 CDN 加进来。
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
# 保留 Host：应用按它拼绝对地址/判断是否 HTTPS（不要写成 $proxy_host）
proxy_set_header Host $host;

# 透传请求 id：应用（server.mjs / 业务层）沿用它做日志关联，
# 从用户报出的编号能直接 grep 到 nginx 与应用两侧的记录。
proxy_set_header X-Request-Id $http_x_request_id;

# 后端是 Node 的长连接：HTTP/1.1 + 清空 Connection 才能复用 upstream keepalive。
# 注意：本项目**没有** WebSocket 需求（生产不走 HMR），所以这里不引 $connection_upgrade。
# 将来若真要上 WS，需在 http 块加一个 map（$http_upgrade → upgrade/close）再改这两行。
proxy_set_header Connection "";
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;