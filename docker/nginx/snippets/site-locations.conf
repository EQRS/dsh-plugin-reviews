# 站点公共 location（80 的重定向站与 443 的 TLS 站都需要这一段）。
#
# 为什么抽成片段：两个 server 块若各抄一份，迟早漂移 —— 改了 /media 的缓存策略
# 只改一处，另一处就成了"悄悄不对"的配置。这里只放**与协议无关**的部分。

# nginx 自己对编排器的存活探针：直接 return，**不回源**。
# 上游挂了不该把入口一起判死（与 web 的 /api/health 口径一致）。
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
}

# 第二道闸门：测试登录通道只给本机自动化用，公网一律拒绝。
# （应用里已有一道：非 1 或生产环境一律 404。这里是不让外网碰到它。）
location = /api/testing/session {
    deny all;
}

# Next 的静态产物文件名自带内容哈希 → 可以长缓存。
# 这一块是纯静态、与登录态无关，交给 nginx 直接回源即可（不做代理磁盘缓存）。
location /_next/static/ {
    include /etc/nginx/snippets/proxy-common.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    proxy_pass http://dsh_web;
}

# 站内媒体（/media/{attachmentId}/{variantKey}）。
# ⚠️ **绝不能**改成 alias/root 直接读盘：媒体是否可见由应用按会话与内容状态判定，
# nginx 直读磁盘等于把私有图全公开。这里只做反代，并明确禁止中间缓存。
location /media/ {
    include /etc/nginx/snippets/proxy-common.conf;
    add_header Cache-Control "private, no-store" always;
    proxy_pass http://dsh_web;
}

# 其余全部交给 Next（页面与 API）。
location / {
    proxy_pass http://dsh_web;
    # 大响应（导出/长列表）不要撑着内存
    proxy_buffering on;
    proxy_buffers 16 16k;
}
