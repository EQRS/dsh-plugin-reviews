# DSH 插件测评站 · nginx 顶层配置
#
# 这份配置只做三件事：把真实 IP 传到应用、给入口加最基本的防护头、把日志写清楚。
# 刻意**不做**：不做代理缓存（媒体是要按会话判权限的，缓存会绕过权限）、
# 不做 rewrite（路由全部由 Next 处理，改路径只会在两处维护同一套规则）。

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志带上下两跳的 IP：
    #   client=$remote_addr        直接连到 nginx 的地址。**nginx 是唯一入口时这就是真实客户端**
    #   xff=$http_x_forwarded_for  上游（CDN/负载均衡）传进来的链路，本部署默认没有
    # 两个字段都留着，是为了将来在前面加一层时能从日志区分"真实客户端"与"上一跳代理"。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'xff="$http_x_forwarded_for" req_id=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # 文本类响应开启 gzip。注意：`gzip_proxied any` 是必须的 ——
    # 反代场景下响应带 Via/X-Forwarded 时，默认不会压缩。
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # 上传体积上限由站点配置覆盖（媒体单张上限见 MEDIA_LIMITS.maxBytes）
    client_max_body_size 12m;
    client_body_buffer_size 256k;

    include /etc/nginx/conf.d/*.conf;
}