# DSH 插件测评站 · 入口站点（nginx 是唯一对外的容器）
#
# 拓扑：客户端 → nginx(80/443) → web 容器(3000) → SQLite
# web 容器**不发布端口**（只挂在 compose 网络里），所以"真实 IP 只能由 nginx 给"，
# 应用因此可以安全地信任 X-Real-IP / X-Forwarded-For（见 snippets/proxy-common.conf）。

upstream dsh_web {
    server web:3000;
    # 与 snippets 里的 `Connection ""` 配套：复用长连接，省掉每请求的 TCP 握手
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 与 http 块同值，写在这里是为了"看站点配置就知道上限"；改大小时两处一起改
    client_max_body_size 12m;

    # 真实 IP 透传 + 安全基线（所有 location 继承；带 add_header 的 location 会再 include 一次）
    include /etc/nginx/snippets/proxy-common.conf;

    # nginx 自己对编排器的存活探针：直接 return，**不回源**。
    # 上游挂了不该把入口一起判死（与 web 的 /api/health 口径一致）。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 第二道闸门：测试登录通道只给本机自动化用，公网一律拒绝。
    # （应用里已有一道：非 1 或生产环境一律 404。这里是不让外网碰到它。）
    location = /api/testing/session {
        deny all;
    }

    # Next 的静态产物文件名自带内容哈希 → 可以长缓存。
    # 这一块是纯静态、与登录态无关，交给 nginx 直接回源即可（不做代理磁盘缓存）。
    location /_next/static/ {
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        proxy_pass http://dsh_web;
    }

    # 站内媒体（/media/{attachmentId}/{variantKey}）。
    # ⚠️ **绝不能**改成 alias/root 直接读盘：媒体是否可见由应用按会话与内容状态判定，
    # nginx 直读磁盘等于把私有图全公开。这里只做反代，并明确禁止中间缓存。
    location /media/ {
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://dsh_web;
    }

    # 其余全部交给 Next（页面与 API）。
    location / {
        proxy_pass http://dsh_web;
        # 大响应（导出/长列表）不要撑着内存
        proxy_buffering on;
        proxy_buffers 16 16k;
    }
}

