# DSH 插件测评站 · 入口站点（nginx 是唯一对外的容器）
#
# 拓扑：客户端 → nginx(80/443) → web 容器(3000) → SQLite
# web 容器**不发布端口**（只挂在 compose 网络里），所以"真实 IP 只能由 nginx 给"，
# 应用因此可以安全地信任 X-Real-IP / X-Forwarded-For（见 snippets/proxy-common.conf）。
#
# 2026-10-18 起：正式域名 review.lingshulab.com + Let's Encrypt 证书（443 对外，80 只做跳转）。
#   证书放宿主 `/root/dsh-plugin-review/certs/`（compose 挂到 /etc/nginx/certs，只读）。
#   ⚠️ **换域名**要同时改三处：本文件的 server_name 与 80 的跳转地址、.env 的
#   GITHUB_REDIRECT_URI / SITE_ORIGIN、GitHub OAuth App 的 Authorization callback URL。
#   ⚠️ 证书不在位时 nginx 会**启动失败**（`cannot load certificate`）—— 这是刻意的：
#   入口起不来，比悄悄退化成明文 HTTP（会话 Cookie 带 Secure 会被浏览器丢弃）好查得多。

upstream dsh_web {
    server web:3000;
    # 与 snippets 里的 `Connection ""` 配套：复用长连接，省掉每请求的 TCP 握手
    keepalive 16;
}

# ---------- 80：只做跳转（外加编排器探针） ----------
# 用 default_server 接住一切（含直接用 IP 访问的），统一送到域名上的 HTTPS。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 探针留在 80：compose 的 healthcheck 打的是 http://127.0.0.1/healthz，
    # 若这里也 301，探针要跟着加 -L 才不误判（没必要的耦合）。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 其余一律 301 到域名上的 HTTPS。**硬编码域名**而不是 $host：
    # 用 IP 访问时 $host 是 IP，跳过去会撞证书域名不匹配的警告页。
    location / {
        return 301 https://review.lingshulab.com$request_uri;
    }
}

# ---------- 443：真正的站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name review.lingshulab.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 只在 HTTPS 站上加 HSTS：加到 80 上没有任何作用（那台只做跳转），还会误导读者。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 与 http 块同值，写在这里是为了"看站点配置就知道上限"；改大小时两处一起改
    client_max_body_size 12m;

    # 真实 IP 透传 + 安全基线（所有 location 继承；带 add_header 的 location 会再 include 一次）
    include /etc/nginx/snippets/proxy-common.conf;

    # 站点 location（与 80 共用同一份，避免两处漂移）
    include /etc/nginx/snippets/site-locations.conf;
}
